		function run_ascend() {
			console.log("called run_ascend")
			if (world == null) {

				world = new instance.ascjson();

			rt1 = world.libr_destroy_types("dummy");
			console.log(rt1.e);

			console.log(rt2a.e);
			console.log(rt2a.v);
			if (rt2a.e != 0)
				return;
			console.log("found modules:");

			rt3 = world.libr_types_in_module(["dummy", "basemodel.a4l<0>"].join("\v"));

			console.log(rt3.v);

			console.log("found types:");
			for (const t of types) {
				console.log(t);
			}
			rth = world.help(["dummy", "library"].join("\v"));
			if (rth.e == 0) {

				help = rth.v.split("\v");
				for (const i of help) {
					console.log(i);
				}
			}
			rtcode = world.ddefine(["dummy", "cmumodel", "/codedump.txt"].join("\v"));
			if (rtcode.e == 0) {
				console.log("output of code is in:","/codedump.txt");
			} else {
				console.log("error:" + rtcode.v);
			}
		}
