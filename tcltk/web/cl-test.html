	<script type="text/javascript" src="output.js" crossorigin="anonymous"></script>
	<script>
		var instance;
		var world;
		// this is supposed to not finish until all is well. (via webidl binder)
		createModule().then(module => {
			instance = module;
		});

		/// Call the method (must also be quoted) with all the string args.
		/// This eliminates manually building the vtab string.
		function asc(method, ...rest) {
			console.log("Calling ascend: ", method);
			// console.log("rest before is:", rest);
			rest.unshift(method);
			// console.log("rest after is:", rest);
			return world[method](rest.join("\v"));
		}
		function check_world(...rest) {
			o = world;
			for (c of rest) {
				if (!(c in o)) {
					o[c] = {};
				}
				o = o[c];
			}
		}

		// fixme: how do we add variables to world object? JS question
		function Solve_set_SolverRegisteredNumbers() {
			rc = asc("slv_available");
			console.log("slvavail: ",rc.v);
			solver_names = rc.v.split("\v");
			for (const s of solver_names) {
				r = asc("slv_number", s);
				// verify ui controller state tree uc is there, or make it
				check_world("uc","solver");
				// world.uc.solver maps to ascSolvVect in tcl
				world.uc.solver[s] = r.v;
				console.log("REGISTERED SOLVER ",s," as number ",
					world.uc.solver[s]);
			}
		}
		function Solve_Import(qlfdid) {
			rc = asc("slv_import_qlfdid", qlfdid, "test");
			if (rc.e != 0) {
				check_world("uc","solverstat");
				world.uc.solverstat["importerror"] = "Instance not a complete model instance.";
				return 1;
			}
			check_world("uc","solver");
			world.uc.solver["simname"] = qlfdid.split(".")[0];
  			// import valid system: builds rel/var/obj lists
			r = asc("slv_import_qlfdid", qlfdid);
			if (r.e != 0) {
				console.log("slv import error: ",r.v);
				return
			}
			r = asc("slv_get_pathname");
			if (r.e != 0) {
				console.log("slv pathname error: ",r.v);
				return
			} else {
				console.log("slv imported instance", r.v);
			}
  			world.uc.solver["instname"] = r.v;
			// fixme: need to do slv_select_solver, but
			// this defaults to QRSlv ok.
			r = asc("slv_presolve");
			r = asc("slv_get_stat_page");
			console.log("slvstats", r.e, " ", r.v);
			r = asc("slv_solve");
			// r = asc("slv_checksys");
			r = asc("slv_get_stat_page");
			console.log("slvstats", r.e, " ", r.v);
		}
		function run_ascend() {
			console.log("called run_ascend")
			if (world == null) {
				console.log("creating the world")
				world = new instance.ascjson();
				console.log("joy to the world")
			}
			// rt2 = asc("librread", "/models/system.a4l");
			rt2 = asc("librread", "/models/basemodel.a4l");
			rt22 = asc("librread", "/models/atoms.a4l");
			rt1 = asc("libr_destroy_types");
			// needs iterate destroy simlist, slv_flush with destroy types
			console.log(rt1.e);
			console.log(rt1.v);
			if (rt1.e != 0)
				return;
			rt2 = asc("librread", "/models/vessel.a4c");
			console.log(rt2.e);
			console.log(rt2.v);
			if (rt1.e != 0)
				return;
			rt2a = asc("libr_query", "-modulelist", "-mtype", "0");
			console.log(rt2a.e);
			console.log(rt2a.v);
			if (rt2a.e != 0)
				return;
			console.log("found modules with types:");
			modules = rt2a.v.split("\v");
			for (const m of modules) {
				if (m.length > 0) {
					console.log("module", m);
					rt3 = asc("libr_types_in_module", m);
					if (rt3.e != 0)
						break;
					types = rt3.v.split("\v");
					if (types.length > 0) {
						console.log("found types in module " + m);
						for (const t of types) {
							if (t.length > 0) {
								console.log(t);
							}
						}
					} else {
						console.log("no types in module " + m);
					}
				}
			}

			for (const m of modules) {
				if (m.length > 0) {
					console.log("libr_moduleinfo", m);
					// bug in append call
					rti = asc("libr_moduleinfo", m);
					if (rti.e != 0)
						break;
					console.log("info: " + rti.v);
				}
			}

			rth = asc( "help","library");
			if (rth.e == 0) {
				console.log("commands from 'help library' output are:");
				help = rth.v.split("\v");
				for (const i of help) {
					console.log(i);
				}
			}
			rth2 = asc("help", "help");
			if (rth2.e == 0) {
				console.log("'help help' output are:");
				help = rth2.v.split("\v");
				for (const i of help) {
					console.log(i);
				}
			}

			rtcode = asc("ddefine");
			if (rtcode.e == 0) {
				console.log("output of types list is ",rtcode.v.split("\v"));
			} else {
				console.log("error:" + rtcode.v);
			}

			rtcode = asc("ddefine", "cmumodel", "dostring");
			if (rtcode.e == 0) {
				console.log("output of model type is");
				console.log(rtcode.v);
			} else {
				console.log("error:" + rtcode.v);
			}

			rtcode = asc("ddefine", "solver_int", "dostring");
			if (rtcode.e == 0) {
				console.log("output of solver_int code is:");
				console.log(rtcode.v);
			} else {
				console.log("error:" + rtcode.v);
			}

			rtcode = asc("ddiffdefine", "solver_binary", "dostring");
			if (rtcode.e == 0) {
				console.log("output of solver_binary new code is:");
				console.log(rtcode.v);
			} else {
				console.log("error:" + rtcode.v);
			}

			rtcode = asc("dgetparts", "MODEL", "vessel");
			if (rtcode.e == 0) {
				console.log("output of vessel model parts are",rtcode.v.split("\v"));
			} else {
				console.log("error:" + rtcode.v);
			}

			rtcode = asc("dgetparts", "ATOM", "vessel");
			if (rtcode.e == 0) {
				console.log("output of vessel atom parts are",rtcode.v.split("\v"));
			} else {
				console.log("error:" + rtcode.v);
			}

			rtcode = asc("disroot_type", "real");
			if (rtcode.e == 0) {
				console.log("real is root type=", rtcode.v);
			} else {
				console.log("error:" + rtcode.v);
			}

			rtcode = asc("disroot_type", "solver_var");
			if (rtcode.e == 0) {
				console.log("solver_var is root type=", rtcode.v);
			} else {
				console.log("error:" + rtcode.v);
			}

			rtcode = asc("drefinement_tree", "factor");
			// convert tree to json
			if (rtcode.e == 0) {
				// fixme: jsonify
				console.log("type tree of 'factor' is:", rtcode.v);
			} else {
				console.log("error:" + rtcode.v);
			}

			rtcode = asc("drefines_me", "real");
			if (rtcode.e == 0) {
				console.log("type children of real are:", rtcode.v.split("\v"));
			} else {
				console.log("error:" + rtcode.v);
			}

			rtcode = asc("drefines_meall", "real");
			if (rtcode.e == 0) {
				console.log("all type descendants of real as list are:", rtcode.v.split("\v"));
			} else {
				console.log("error:" + rtcode.v);
			}

			rtcode = asc("hier", "solver_binary");
			if (rtcode.e == 0) {
				console.log("all type ancestors of solver_binary are:", rtcode.v.split("\v"));
			} else {
				console.log("error:" + rtcode.v);
			}

			rtcode = asc("libr_extract_type", "cmumodel", "/models/basemodel.a4l","-s");
			// alternates: libr_extract_type [-c] <type> [source_file] [-s,destination_file]
			// fixme
			if (rtcode.e == 0) {
				console.log("code for cmumodel is ", rtcode.v);
			} else {
				console.log("error:" + rtcode.v);
			}

			model_string = "MODEL catch_Word_model2 (* Bill Gates sacrificial goat *); \
(* This MODEL does nothing. \
 * Normally catch_Word_model just gets parsed and ignored. \
 * \
 * If the user has tried to read a Microsoft Word binary file, Tcl file, \
 * or some other piece of junk as if it were an ASCEND MODEL \
 * source file, then catch_Word_model will die on an unknown \
 * syntax error. \
 * While catch_Word_model is dying the parser returns a good \
 * starting condition. \
 * \
 * Here is the message of recovery when this MODEL fails: \
Asc-Error: Model definition \"catch_Word_model\" abandoned due to syntax errors. \
Asc-Error: Rejected \"catch_Word_model\" at line basemodel.a4l:62. \
 \
        @TODO document how this works \
 *) \
END catch_Word_model2;";
			rtcode = asc("libr_parsestring", model_string);
			if (rtcode.e == 0) {
				console.log("string parsed to module name:", rtcode.v);
			} else {
				console.log("error:" + rtcode.v);
			}

			Solve_set_SolverRegisteredNumbers();

			rc = asc("asc_compiler_option", "-useCopyAnon", "0");
			if (rc.e != 0) {
				console.log("failed: asc_compiler_option", "-useCopyAnon", "0", rc.v);
				return;
			}
			r = asc("sim_instantiate", "vp", "vessel");
			if (r.e != 0 ) {
				console.log("create vp failed: ", r.v);
				return;
			} 
			// set search pointer
			r = asc("qlfdid","vp");
			// set browser pointer from search pointer
			r = asc("btransfer");
			// run a method regardless of in browser or not
			r = asc("brow_runmethod", "-method", "on_load", "-qlfdid","vp");

			r = asc("qlfdid","vp");
			// get equations in search model in  conventional format
			r = asc("bgetrels","search");
			if (r.e) {
				console.log("getrels returned", r.e, r.v);
			} else {
				console.log("relations:");
				for (const e of r.v.split("\v")) {
					console.log(e);
				}
			}

			// get equations in current model (from btransfer) in  postfix stack format
			r = asc("bgetrelspf","search");
			if (r.e) {
				console.log("getrelspf returned", r.e, r.v);
			} else {
				console.log("postfix relations:", r.v);
				for (const e of r.v.split("\v")) {
					console.log(e);
				}
			}
			r = asc("brow_child_list","search","all","VALUE","ATOMS");
			//  <current,search> <all,N> ["TYPE","VALUE"] ["ATOMS"] ["PASSED"]
			console.log(r.v);

			// export name to solver, whether in browser or not.
			Solve_Import("vp");

			r = asc("slv_presolve");
			r = asc("slv_get_stat_page");
			console.log(r.v);

			r = asc("slv_solve");

			r = asc("slv_get_stat_page");
			jobj = JSON.parse(r.v);
			console.log(jobj);

			r = asc("slv_get_cost_page");
			jobj = JSON.parse(r.v);
			console.log(jobj);

			r = asc("slv_flush_solver");

			r = asc("sim_destroy","vp");

// sim_BinTokenSetOptions
// libr_hide_type $TYPE $PARTNAME (exclude PARTNAME from listing ot TYPE)
// libr_type_is_shown
// libr_unhide_type
// libr_query
		}
	</script>
	<button onclick="run_ascend();">try ascend interpreter</button>
